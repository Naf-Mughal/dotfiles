# Written by the Shell plugin (nafeel/shell); removed when it's disabled.
# Renders every Material role of the current palette for the shell.
[theme.templates.user.nafeel_shell]
input_path = "/home/nafeel/.local/share/noctalia/plugins/shell/templates/scheme.json"
output_path = "~/.local/state/nafeel-shell/scheme.json"

# The shell is the notification server while it runs.
[notification]
enable_daemon = false

# Noctalia's panels the shell still opens (clipboard, launcher fallback) match
# it: floating, the clipboard in the top-left corner by its bar icon, and the
# shell's corner rounding.
[shell]
corner_radius_scale = 0.8
# The shell's polkit agent asks for passwords instead.
polkit_agent = false

[shell.panel]
clipboard_placement = "floating"
clipboard_position = "top_left"

# The shell draws the bar and the dock: Noctalia's are off while it runs.
[bar.main]
enabled = false

[bar.default]
enabled = false

[dock]
enabled = false

# The shell's OSD shows all of these.
[osd.kinds]
volume = false
brightness = false
wifi = false
bluetooth = false
power_profile = false
dnd = false
caffeine = false
nightlight = false
lock_keys = false
keyboard_layout = false
privacy = false
