# ─── Edges: four-sided frame (plugin nafeel/edges) ───────────────────────────
# Installed as ~/.config/noctalia/edges.toml.
#
#   left    the main bar (bar.default - icons and the 12-hour clock live here)
#   top     thin border; the dock grows out of its centre. Notification toasts
#           sit in its top-right corner.
#   right   thin border; hover its centre for the volume/brightness sliders
#   bottom  thin border; hover its centre for the Control Center, its right end
#           for the action center (notifications, quick toggles, sliders,
#           session buttons) in the bottom-right corner.
#
# Hover zones open their panel on a named bar with `panel-open @<bar> <id>`
# (patched Noctalia build, ~/.local/opt/noctalia-edges).
#
# The top bar does not reserve space - Umbriel's [layout.struts] top = 10 keeps
# windows clear of it instead. That lets it sit between the left and right bars
# (its rounded corners land on the inner frame corners) and lets the dock anchor
# at the real screen edge, over the border, so it reveals from the top edge.

[bar]
order = ["default", "right", "bottom", "top"]

[bar.bottom]
position = "bottom"
layer = "overlay"
thickness = 18
margin_ends = 0
padding = 0
radius = 24
radius_bottom_left = 0
radius_bottom_right = 0
concave_edge_corners = true
shadow = false
contact_shadow = true
hover_highlight = false
start = []
center = ["edges-command"]
end = ["edges-action"]

[bar.right]
position = "right"
layer = "overlay"
thickness = 18
margin_ends = 0
padding = 0
radius = 24
radius_top_left = 0
radius_top_right = 0
radius_bottom_left = 0
radius_bottom_right = 0
concave_edge_corners = true
shadow = false
contact_shadow = true
hover_highlight = false
start = []
center = ["edges-sliders"]
end = []

[bar.top]
position = "top"
layer = "overlay"
thickness = 18
margin_ends = 0
padding = 0
radius = 24
radius_top_left = 0
radius_top_right = 0
concave_edge_corners = true
reserve_space = false
shadow = false
hover_highlight = false
start = []
center = []
end = []

# Main bar (left). Moved here from the GUI state file, which would otherwise
# override it. Top: [ workspaces ] (filled primary) [ notifications · clipboard
# · capture ] (tonal secondary). Bottom of the end lane, M3 Expressive style:
#   [ tray ]                         neutral tonal pill
#   [ volume · brightness ]          tonal secondary pill - the sliders
#   [ wifi · bluetooth · battery ]   filled primary pill - connectivity / power
#   ( power )                        tonal error squircle, shape-contrasts the pills
# Noctalia has no *_container roles, so tonal containers are the base role at
# low opacity - still follows the wallpaper palette.
[bar.default]
position = "left"
layer = "overlay"                    # attached panels inherit this: always on top
thickness = 42
margin_ends = 0
radius = 16
radius_top_left = 0
radius_top_right = 0
radius_bottom_left = 0
radius_bottom_right = 0
contact_shadow = true
widget_spacing = 8
start = ["group:spaces", "group:tools"]
end = ["m3-media", "group:tray", "group:sliders", "group:status", "m3-session"]

[[bar.default.capsule_group]]
id = "spaces"
members = ["m3-workspaces"]
fill = "primary"                     # same filled primary as the status group
foreground = "on_primary"
padding = 6.0

[[bar.default.capsule_group]]
id = "tools"
members = ["m3-notifications", "m3-clipboard", "nafeel/capture:bar"]
fill = "secondary"                   # same tonal secondary as the sliders group
opacity = 0.22
foreground = "secondary"
padding = 7.0
widget_spacing = 12

[[bar.default.capsule_group]]
id = "tray"
members = ["tray"]
fill = "on_surface"
opacity = 0.07
padding = 7.0

[[bar.default.capsule_group]]
id = "sliders"
members = ["m3-volume", "m3-brightness"]
fill = "secondary"
opacity = 0.22
foreground = "secondary"
padding = 7.0
widget_spacing = 12

[[bar.default.capsule_group]]
id = "status"
members = ["m3-network", "m3-bluetooth", "m3-battery"]
fill = "primary"
foreground = "on_primary"
padding = 7.0
widget_spacing = 12

# ─── Widgets ─────────────────────────────────────────────────────────────────

# Main-bar controls (plugin nafeel/m3-panels:control): a live icon that
# opens its M3 panel on hover - no tooltips, the details are in the panels.
# Right-click is the quick action; scrolling is bound below.
[widget.m3-network]
type = "nafeel/m3-panels:control"
kind = "network"

[widget.m3-bluetooth]
type = "nafeel/m3-panels:control"
kind = "bluetooth"

[widget.m3-volume]
type = "nafeel/m3-panels:control"
kind = "volume"
  [widget.m3-volume.actions]
  scroll_up = "volume-up"
  scroll_down = "volume-down"

[widget.m3-brightness]
type = "nafeel/m3-panels:control"
kind = "brightness"
  [widget.m3-brightness.actions]
  scroll_up = "brightness-up"
  scroll_down = "brightness-down"

[widget.m3-battery]
type = "nafeel/m3-panels:control"
kind = "battery"

[widget.m3-media]
type = "nafeel/m3-panels:control"
kind = "media"

[widget.m3-notifications]
type = "nafeel/m3-panels:control"
kind = "notifications"

[widget.m3-clipboard]
type = "nafeel/m3-panels:control"
kind = "clipboard"

[widget.m3-session]
type = "nafeel/m3-panels:control"
kind = "session"
capsule = true
capsule_fill = "error"
capsule_opacity = 0.2
capsule_foreground = "error"
capsule_radius = 12
capsule_padding = 8.0

# Left bar clock, 12-hour.
[widget.clock]
format = "{:%I:%M %p}"
vertical_format = "{:%I\n%M\n%p}"
tooltip_format = "{:%A, %B %-d, %Y}"

[widget.edges-command]
type = "nafeel/edges:zone"
action = "panel-open @bottom control-center"
length = 420
delay_ms = 120

[widget.edges-action]
type = "nafeel/edges:zone"
action = "panel-open nafeel/edges:center"
length = 260
delay_ms = 120

[widget.edges-sliders]
type = "nafeel/edges:zone"
action = "panel-open @right nafeel/edges:sliders"
length = 260
delay_ms = 120

# ─── Surfaces ────────────────────────────────────────────────────────────────

# Toasts flush in the top-right corner: the top bar reserves nothing, so step
# down by its thickness (18); the right bar reserves its own space.
[notification]
position = "top_right"
offset_x = 0
offset_y = 18
border = false
background_opacity = 1.0

[dock]
position = "top"
auto_hide = true
smart_auto_hide = false
margin_edge = 0
margin_ends = 0
concave_edge_corners = true
background_opacity = 1.0
border_width = 0.0
shadow = false

[shell.panel]
# Panels above everything, fullscreen windows and the frame bars included.
floating_layer = "overlay"
# Pinned floating panels (the action center) touch the bars instead of
# floating 8px off them.
floating_offset = 0
control_center_placement = "attached"
control_center_position = "auto"

# Workspaces: the plugin's page indicator (numbered active pill, dots twice
# the size Noctalia's focus_hint style allows).
[widget.m3-workspaces]
type = "nafeel/m3-panels:workspaces"

