# ─── Cave Abode (plugin nafeel/cave-abode) ───────────────────────────────────
# Installed as ~/.config/noctalia/cave-abode.toml.
#
# The session menu's Lock buttons start the Cave Abode lock (the other three
# are Noctalia's defaults, restated because a custom list replaces them all),
# and palette or wallpaper changes reach the lock straight away.

[hooks]
wallpaper_changed = ["noctalia msg plugin nafeel/cave-abode:service all sync"]
colors_changed = ["noctalia msg plugin nafeel/cave-abode:service all sync"]

[[shell.session.actions]]
action = "lock"
command = "noctalia msg plugin nafeel/cave-abode:service all lock"
shortcut = "1"

[[shell.session.actions]]
action = "logout"
shortcut = "2"

[[shell.session.actions]]
action = "lock_and_suspend"
command = "noctalia msg plugin nafeel/cave-abode:service all lock-and-suspend"
shortcut = "3"

[[shell.session.actions]]
action = "reboot"
shortcut = "4"

[[shell.session.actions]]
action = "shutdown"
variant = "destructive"
shortcut = "5"
