[main]
include=~/.config/foot/themes/noctalia

shell=fish
title=foot
font=JetBrains Mono Nerd Font:size=12
letter-spacing=0
dpi-aware=no
pad=25x25
bold-text-in-bright=no
gamma-correct-blending=no

[scrollback]
lines=10000
# Scroll speed in foot only (default 3.0). The touchpad scroll_factor in umbriel
# is 0.225, so a higher value makes up for it here.
multiplier=20.0

[cursor]
style=beam
beam-thickness=1.5

[colors-dark]
# The opacity comes from the shell (Settings: Theme, App opacity) through
# the included theme.
alpha-mode=matching
blur=yes

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
search-start=Control+Shift+f

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G

[text-bindings]
# ctrl+z sends ctrl+_ (undo in Claude Code / fish) instead of suspending
\x1f = Control+z
