[colors]
background = "#1d1d1dFF"
text_primary = "#e8e8e8FF"
text_muted = "#bebebeFF"
accent_primary = "#ebebebFF"
accent_secondary = "#c4c4c4FF"
warning = "#9e9e9eFF"
error = "#f6857aFF"
insert_hint = "#9e9e9e80"
backdrop = "#1d1d1dFF"

[colors.border]
focused = "#ebebebFF"
unfocused = "#1d1d1dFF"
outer = "#0f0f0fFF"

[colors.overview]
background_tint = "#0f0f0f88"
badge = "#ebebebFF"
workspace_background = "#0f0f0fFF"

[[window_rule]]
match.is_scratchpad = true
border_color_focused = "#9e9e9eFF"
border_color_unfocused = "#4f3a3aFF"
