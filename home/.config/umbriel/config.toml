# Umbriel starting configuration
#
# Copy this file to ~/.config/umbriel/config.toml. Most changes apply when the
# file is saved. Check edits with `umbriel config validate`.
#
# Complete reference: https://docs.noctalia.dev/umbriel/
#
# Commented settings below are examples, not built-in defaults.

# ==============================================================================
# Includes

# Optional split configuration
# https://docs.noctalia.dev/umbriel/configuration/#include
[include]
files = []

[include.optional]
# plugins/*.toml are written by Noctalia plugins (nafeel/*); keybinds here win over theirs.
files = ["plugins/window-switcher.toml", "plugins/app-theming.toml", "plugins/file-manager.toml", "plugins/shell.toml", "plugins/shell-frost.toml", "noctalia.toml"]

# ==============================================================================
# General

# Optional session examples. XWayland support is enabled by default.
# https://docs.noctalia.dev/umbriel/configuration/#general
 [general]
 # The desktop: the nafeel shell (its supervisor restarts it if it crashes).
 # Before the cut-over (N7) this was Noctalia: /home/nafeel/.local/opt/noctalia-edges/bin/noctalia
 autostart = ["/home/nafeel/.local/share/noctalia/plugins/shell/bin/nafeel-shell"]
 xwayland = true
# Sharp X11 apps and games on scaled outputs; they see physical resolutions.
 xwayland_native_resolution = true

# ==============================================================================
# Lid events

# Remove the laptop panel from the desktop while the lid is closed, then
# restore it when the lid opens. Replace eDP-1 with the name from
# `umbriel outputs`.
# https://docs.noctalia.dev/umbriel/configuration/#events
# [events]
# lid_close = "umbriel msg output-disable:eDP-1"
# lid_open = "umbriel msg output-enable:eDP-1"

# ==============================================================================
# Screencast

# By default, the first target-changing action during an active share asks for
# confirmation. Disable that protection only if immediate keybind changes are
# preferred.
# https://docs.noctalia.dev/umbriel/configuration/#screencast
# [screencast]
# disable_dynamic_confirmation = true

# ==============================================================================
# Outputs

# Outputs are machine-specific. Run `umbriel outputs` to find names and modes.
# https://docs.noctalia.dev/umbriel/outputs/
#
# [output.DP-1]
# mode = "2560x1440@144"
# position = [0, 0]
# scale = 1.25
# vrr = "fullscreen"
# hdr = "auto"

[output.eDP-1]
mode = "1920x1080@60" # Replace with your preferred resolution/refresh rate
scale = 1.0
position = [0, 0]

# ==============================================================================
# Appearance
# Blur: Ryoku's frosted-paper recipe (small radius, one pass, a little grain,
# colour from behind bleeding through), for the shell's frosted paper and any
# translucent window.
# https://docs.noctalia.dev/umbriel/appearance/
[appearance.blur]
radius = 4
passes = 1
noise = 0.01
saturation = 1.17

# Choose the background color shown if the lock screen takes too long to appear.
# [colors]
# backdrop = "#000000FF"

# ==============================================================================
# Effects
# Every effect is off until a preset is selected; border and window effects
# scale with overview zoom. Include a bundled preset (adjust /usr for the
# package prefix), then select it by name.
# https://docs.noctalia.dev/umbriel/effects/
# [include]
# files = ["/usr/share/umbriel/effects/border/pulse/effect.toml"]
# For a cursor tail, include /usr/share/umbriel/effects/cursor/trail/effect.toml
# and set cursor = "trail" in [effects].
# Pools accept matching presets defined/included separately. This one-member
# example uses the bundled pulse preset; add other border names to choose.
# [effects.pool.borders]
# kind = "border"
# choose = ["pulse"]
# selection = "unused_first" # or round_robin, random
# Select with border = "borders" in your [effects] table.
# Add to your existing [keybinds] table:
# "Mod+Shift+E" = "effect-border-cycle:borders"
# "Mod+Ctrl+E" = "effect-border-toggle"
# "Mod+Alt+E" = "effect-border-reset"

# [effects]
# border = "pulse"

# ==============================================================================
# Input
# Enable NumLock when a physical keyboard connects.
# https://docs.noctalia.dev/umbriel/input/
[input.keyboard]
numlock_toggle = true

[input.touchpad]
# Windows precision-touchpad feel
# Toggle natural scroll to reverse direction (true = touch-style, false = traditional)
natural_scroll = true
tap = true                          # tap to click
tap_button_map = "left_right_middle" # 2-finger tap = right click, 3-finger = middle
click_method = "clickfinger"        # 2-finger press = right click (no corner zones)
disable_while_typing = true
accel_profile = "flat"               # no pointer acceleration (was adaptive)
sensitivity = 0.5                   # -1.0..1.0, raise for faster pointer

# Lower the scroll multiplier to slow down fast scrolling (default is 1.0)
scroll_factor = 0.225                # slow drags move less; flicks still coast in apps (default 1.0)

# External mouse: no acceleration ("Enhance pointer precision" off).
[input.mouse]
accel_profile = "flat"
sensitivity = 0.0                   # -1.0..1.0, raise for faster pointer

# Focus can follow the pointer across tiled, floating, and pinned windows.
# [input.focus]
# follows_mouse = true

# Confine touch input to one display.
# [input.touch]
# enabled = true
# map_to_output = "eDP-1"

# ==============================================================================
# Keybinds
# Defining this table replaces the built-in bind set, so every active bind that
# should remain available is listed here.
# Syntax: https://docs.noctalia.dev/umbriel/keybinds/
# Actions: https://docs.noctalia.dev/umbriel/actions/
[keybinds]

# Applications and session
# shell-msg (nafeel/shell's bin/shell-msg, linked into ~/.local/bin) opens the
# shell's surfaces, or Noctalia's panels when the shell is off.
"Mod+Return" = { action = "spawn:foot", repeat = false }
"Mod+T" = { action = "spawn:foot", repeat = false }
"Mod+G" = { action = "spawn:google-chrome-stable", repeat = false }
"Ctrl+Shift+Escape" = { action = "spawn:foot -e btop", repeat = false }
"Mod" = "spawn:shell-msg command home"  # the shell's command center (Noctalia's control center when the shell is off)
"Mod+Space" = { action = "spawn:shell-msg launcher", repeat = false }
"Mod+V" = { action = "spawn:shell-msg clipboard", repeat = false }
"Mod+W" = { action = "spawn:shell-msg wallpaper", repeat = false }
"Mod+S" = { action = "spawn:shell-msg settings", repeat = false }
"Mod+X" = { action = "spawn:shell-msg notes", repeat = false }
"Mod+Q" = { action = "window-close", repeat = false }
"Mod+Escape" = { action = "spawn:shell-msg session", repeat = false }  # the session corner
"Mod+N" = { action = "spawn:shell-msg notifications", repeat = false }
"Mod+A" = { action = "spawn:shell-msg actions", repeat = false }

# idle-kit: lock / sleep / caffeine / screen off
"Mod+L" = { action = "spawn:shell-msg lock", repeat = false }  # the shell's cave-abode lock
"Mod+Shift+L" = { action = "spawn:shell-msg suspend", repeat = false }  # lock, then sleep
"Mod+Ctrl+C" = { action = "spawn:shell-msg caffeine", repeat = false }
"Mod+Ctrl+Escape" = { action = "dpms-off", repeat = false }

# Screenshot and screen recording (plugin nafeel/capture) - also on the lock screen
"Mod+Shift+S" = { action = "spawn:shell-msg snip", allow_when_locked = true, repeat = false }
"Mod+Shift+R" = { action = "spawn:shell-msg record", allow_when_locked = true, repeat = false }

# idle-kit: brightness, volume and media keys (also on the lock screen)
"XF86MonBrightnessUp" = { action = "spawn:brightnessctl -q set 5%+", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn:brightnessctl -q set 5%-", allow_when_locked = true }
"XF86AudioRaiseVolume" = { action = "spawn:wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn:wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn:wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle", allow_when_locked = true }
"XF86AudioPlay" = { action = "spawn:playerctl play-pause", allow_when_locked = true, repeat = false }
"XF86AudioPause" = { action = "spawn:playerctl pause", allow_when_locked = true, repeat = false }
"XF86AudioNext" = { action = "spawn:playerctl next", allow_when_locked = true, repeat = false }
"XF86AudioPrev" = { action = "spawn:playerctl previous", allow_when_locked = true, repeat = false }
"Mod+Shift+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }

# Focus and movement
"Mod+Left" = "window-focus-left"
"Mod+Down" = "window-focus-down"
"Mod+Up" = "window-focus-up"
"Mod+Right" = "window-focus-right"
"Mod+H" = "window-focus-left"
"Mod+J" = "window-focus-down"
"Mod+K" = "window-focus-up"
"Mod+F1" = "window-focus-next"
"Mod+Shift+Left" = "column-move-left"
"Mod+Shift+Down" = "window-move-down"
"Mod+Shift+Up" = "window-move-up"
"Mod+Shift+Right" = "column-move-right"

# Window state and layout
"Mod+Shift+F" = { action = "window-toggle-floating", repeat = false }  # was Mod+T
"Mod+Shift+T" = { action = "window-focus-switch-floating", repeat = false }
"Mod+P" = { action = "window-toggle-pinned", repeat = false }
"Mod+M" = { action = "window-toggle-maximize-to-edges", repeat = false }
"Mod+F" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+Ctrl+F" = { action = "window-toggle-maximize", repeat = false }
"Mod+Ctrl+R" = "window-cycle-primary-extent-back"  # was Mod+Shift+R (now screen recording)
"Mod+Comma" = "window-consume-left"
"Mod+Period" = "window-consume-right"
"Mod+Ctrl+Comma" = "window-consume-from-left"
"Mod+Ctrl+Period" = "window-consume-from-right"
"Mod+Shift+W" = { action = "column-toggle-tabbed", repeat = false }  # was Mod+W
"Mod+Alt+Right" = "column-focus-tab-next"
"Mod+Alt+Left" = "column-focus-tab-previous"
"Mod+WheelUp" = "window-focus-left"
"Mod+WheelDown" = "window-focus-right"
"Mod+O" = { action = "overview-toggle", repeat = false }

# Workspaces
"Mod+1" = "workspace-switch:1"
"Mod+2" = "workspace-switch:2"
"Mod+3" = "workspace-switch:3"
"Mod+4" = "workspace-switch:4"
"Mod+5" = "workspace-switch:5"
"Mod+6" = "workspace-switch:6"
"Mod+7" = "workspace-switch:7"
"Mod+8" = "workspace-switch:8"
"Mod+9" = "workspace-switch:9"
"Mod+Shift+1" = "window-move-to-workspace:1"
"Mod+Shift+2" = "window-move-to-workspace:2"
"Mod+Shift+3" = "window-move-to-workspace:3"
"Mod+Shift+4" = "window-move-to-workspace:4"
"Mod+Shift+5" = "window-move-to-workspace:5"
"Mod+Shift+6" = "window-move-to-workspace:6"
"Mod+Shift+7" = "window-move-to-workspace:7"
"Mod+Shift+8" = "window-move-to-workspace:8"
"Mod+Shift+9" = "window-move-to-workspace:9"

# Scratchpad
"Mod+Shift+Space" = { action = "window-move-to-scratchpad", repeat = false }
"Mod+Z" = "scratchpad-toggle"  # was Mod+Space
"Mod+Ctrl+Space" = { action = "window-restore-from-scratchpad", repeat = false }

# ==============================================================================
# Layout
# New scrolling-layout windows start at half the output width. Without this
# setting, each application chooses its starting width. Stacked columns retain
# their most recently focused row when focus leaves and later returns.
# https://docs.noctalia.dev/umbriel/layout/
[layout]
extent_presets = [0.333, 0.5, 0.667]

# [layout.struts] lives in plugins/shell.toml, written by the Shell plugin
# (nafeel/shell): the shell's frame while it runs, nothing when it's off
# (Noctalia's bars reserve their own space). Keys set here would win over it.

[layout.scrolling]
default_extent_fraction = 0.5

# A tab group shows one window at a time below a bar of titles, and stacks and
# resizes like any row of its column. Mod+W tabs the focused window with the
# windows stacked beside it; Mod+Shift+J/K move a tab out of its group or a
# window into one. Click, scroll, or drag a title to switch, reorder, or pull it
# out.
# [layout.tabs]
# default_display = "normal"
# new_tab_position = "after_active"
# middle_click_closes = true
#
# [appearance.tab_bar]
# style = "titles"         # "indicator" draws thin slots without titles
# height = 24
# font = "sans 10"
# visible = true           # false hides every bar; tabs keep working
# hide_when_single = false
# max_tabs = 6            # show at most 6 slots; more tabs scroll
# overflow = "scroll"      # or "shrink" to fit every tab

# ==============================================================================
# Window rules
# Rules combine in order, with later values overriding earlier ones.
# https://docs.noctalia.dev/umbriel/window-rules/

# Blur windows using the non-optimized path so translucent windows include
# overlapping windows behind them.
[[window_rule]]
blur = true
blur_optimized = false

# Open every tiled window maximized inside the work area (bar and gaps stay
# visible). Floating windows and dialogs keep their own size.
[[window_rule]]
default_maximize = true

[[window_rule]]
match.is_floating = true
default_maximize = false

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_maximize = false
default_floating_size_px = { width = 1020, height = 900 }

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_maximize = false
default_floating_size_px = { width = 800, height = 600 }

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

[[window_rule]]
match.title = "^notificationtoasts_.+_desktop"
default_position = { x = 0, y = 0, anchor = "bottom_right" }
default_focused = false
default_pinned = true

# Keep game menus inside their window; a focus or workspace keybind releases the pointer.
# [[window_rule]]
# match.app_id = "^steam_app_.*$"
# confine_pointer = true

# Named scratchpads can launch an application when toggled while empty.
# [[scratchpad]]
# name = "music"
# spawn_when_empty = "spotify"

# [[window_rule]]
# match.app_id = "^spotify$"
# default_scratchpad = "music"

# Give scratchpad windows their own border colors.
# [[window_rule]]
# match.is_scratchpad = true
# border_color_focused = "#E5C07BFF"
# border_color_unfocused = "#5C4A2AFF"

# Leave an application that draws its own corners and shadow undecorated.
# [[window_rule]]
# match.app_id = "^org[.]gnome[.]TextEditor$"
# border_width = 0
# corner_radius = 0
# shadow = false

# ==============================================================================
# Layer rules
# https://docs.noctalia.dev/umbriel/layer-rules/
[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true
blur_optimized = false

# ==============================================================================
# Overview
# Built-in overview and animation values are used. The top-left hot corner opens
# the overview after a short delay.
# Overview: https://docs.noctalia.dev/umbriel/workspaces-overview/
# Animation: https://docs.noctalia.dev/umbriel/animation/
# Shorter swipes: 3-finger workspace/column swipes and the 4-finger overview
# swipe travel further per finger movement (default 1.0).
[overview]
scroll_factor_horizontal = 1.8
scroll_factor_vertical = 1.8

[hot_corners.top_left]
enabled = true
delay_ms = 500
action = "overview-open"
