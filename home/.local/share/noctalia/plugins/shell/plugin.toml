# Shell - every on-screen surface of the desktop (frame, bar, drawers, dock,
# command center, ...) as one Quickshell shell (quickshell/), on top of umbriel
# and Noctalia's services. Noctalia keeps the services, settings, launcher and
# templates; this plugin replaces its bars.
#
# service   starts and supervises the shell (bin/nafeel-shell), hides
#           Noctalia's bars and dock while it runs, reserves the frame's edges
#           in umbriel (~/.config/umbriel/plugins/shell.toml), and registers a
#           theme template that gives the shell every Material colour role
#           (~/.config/noctalia/shell.toml -> ~/.local/state/nafeel-shell/scheme.json).
#           Disabling the plugin puts all of that back.
#
# Drive the shell from keybinds over its IPC:
#
#   qs -p ~/.local/share/noctalia/plugins/shell/quickshell ipc call shell toggle <drawer>

id = "nafeel/shell"
name = "Shell"
version = "0.1.0"
plugin_api = 32
author = "nafeel"
license = "GPL-3.0-or-later"
dependencies = ["quickshell", "umbriel"]
tags = ["bar", "panel", "shell", "theme"]
icon = "layout-dashboard"
description = "A Caelestia-style Quickshell shell: one frame with the bar, drawers, dock and command center, themed from Noctalia."

# Settings live in the shell now (its Settings panel, Mod+S;
# ~/.config/nafeel-shell/settings.json), not in Noctalia's settings window.

[[service]]
id = "service"
entry = "service.luau"
