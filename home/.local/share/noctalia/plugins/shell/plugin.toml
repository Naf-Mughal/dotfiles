# Shell - every on-screen surface of the desktop (frame, bar, drawers, dock,
# command center, ...) as one Quickshell shell (quickshell/), on top of umbriel
# and Noctalia's services. Noctalia keeps the services, settings, launcher and
# templates; this plugin replaces its bars.
#
# service   starts and supervises the shell (bin/nafeel-shell), hides
#           Noctalia's bars and dock while it runs, reserves the frame's edges
#           in umbriel (~/.config/umbriel/plugins/shell.toml), and registers a
#           theme template that gives the shell every Material colour role
#           (~/.config/noctalia/shell.toml -> ~/.local/state/nafeel-shell/scheme.json).
#           Disabling the plugin puts all of that back.
#
# Drive the shell from keybinds over its IPC:
#
#   qs -p ~/.local/share/noctalia/plugins/shell/quickshell ipc call shell toggle <drawer>

id = "nafeel/shell"
name = "Shell"
version = "0.1.0"
plugin_api = 32
author = "nafeel"
license = "GPL-3.0-or-later"
dependencies = ["quickshell", "umbriel"]
tags = ["bar", "panel", "shell", "theme"]
icon = "layout-dashboard"
description = "A Caelestia-style Quickshell shell: one frame with the bar, drawers, dock and command center, themed from Noctalia."

[[setting]]
key = "radius"
type = "select"
label_key = "settings.radius.label"
description_key = "settings.radius.description"
default = "restrained"
options = [
  { value = "tight", label_key = "settings.radius.tight" },
  { value = "compact", label_key = "settings.radius.compact" },
  { value = "restrained", label_key = "settings.radius.restrained" },
  { value = "relaxed", label_key = "settings.radius.relaxed" },
  { value = "generous", label_key = "settings.radius.generous" },
]

[[setting]]
key = "immersion"
type = "select"
label_key = "settings.immersion.label"
description_key = "settings.immersion.description"
default = "immersive"
options = [
  { value = "immersive", label_key = "settings.immersion.immersive" },
  { value = "ornament", label_key = "settings.immersion.ornament" },
]

[[setting]]
key = "motion"
type = "select"
label_key = "settings.motion.label"
description_key = "settings.motion.description"
default = "normal"
options = [
  { value = "normal", label_key = "settings.motion.normal" },
  { value = "brisk", label_key = "settings.motion.brisk" },
  { value = "reduced", label_key = "settings.motion.reduced" },
]

[[setting]]
key = "paper"
type = "select"
label_key = "settings.paper.label"
description_key = "settings.paper.description"
default = "85"
options = [
  { value = "90", label_key = "settings.paper.p90" },
  { value = "85", label_key = "settings.paper.p85" },
  { value = "80", label_key = "settings.paper.p80" },
  { value = "solid", label_key = "settings.paper.solid" },
]

[[setting]]
key = "location"
type = "string"
label_key = "settings.location.label"
description_key = "settings.location.description"
default = ""

[[service]]
id = "service"
entry = "service.luau"
