# ─── Capture (plugin nafeel/capture) ─────────────────────────────────────────
# Installed as ~/.config/noctalia/capture.toml.
#
# Noctalia takes the screenshots (region picker, freeze, clipboard); instead of
# saving them itself it pipes each PNG to the Capture plugin, which saves it to
# `directory` and posts a notification with a preview and Open / Edit /
# Folder / Delete. Recording settings are the plugin's own (Settings → Plugins
# → Capture).

[shell.screenshot]
directory = "~/Pictures/Screenshots"
copy_to_clipboard = true
annotate = false                     # no editor in between
confirm_region = false               # a region is taken as soon as you let go
save_to_file = false                 # the plugin saves it, below
pipe_to_command = true
pipe_command = 'f="$NOCTALIA_SCREENSHOT_PATH"; mkdir -p "$(dirname "$f")" && cat > "$f" && noctalia msg plugin nafeel/capture:service all saved "$f"'
