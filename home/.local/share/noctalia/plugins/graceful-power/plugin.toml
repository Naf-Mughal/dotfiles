# Graceful Power - Windows-style Restart / Shut down.
#
# The session menu's Restart and Shut down ask every window to close first
# (apps save their session or ask about unsaved work), wait for them, and if
# any app holds out, show "N apps are preventing restart" with
# "Restart anyway" / "Cancel".
#
#   bin/graceful-power reboot|shutdown|logout
#
# service  -> writes [shell.session.power] to ~/.config/noctalia/graceful-power.toml
#             on start and puts it back if it goes missing

id = "nafeel/graceful-power"
name = "Graceful Power"
version = "1.0.0"
plugin_api = 32
author = "nafeel"
license = "MIT"
dependencies = ["jq", "notify-send"]
tags = ["session", "power", "shutdown", "restart", "utility"]
icon = "power"
description = "Restart and Shut down close your apps first and tell you which ones are holding things up, like Windows."

[[service]]
id = "service"
entry = "service.luau"
