# File Manager - one default file manager (Dolphin) everywhere.
#
# The service sets all of these on every start and whenever the setting
# changes, and puts them back if they go missing:
#
#   ~/.config/umbriel/plugins/file-manager.toml
#                         Mod+E opens the file manager; included (optional)
#                         from ~/.config/umbriel/config.toml
#   ~/.local/share/dbus-1/services/org.freedesktop.FileManager1.service
#                         "Show in folder" (screenshots, browsers, ...) goes to
#                         it; the user dir wins over the five system ones
#   xdg-mime inode/directory
#                         xdg-open on a folder opens it
#
# service  -> applies the above; IPC "apply" does it now

id = "nafeel/file-manager"
name = "File Manager"
version = "1.0.0"
plugin_api = 32
author = "nafeel"
license = "MIT"
tags = ["file-manager", "default-apps", "keybinds", "utility"]
icon = "folder"
description = "Makes Dolphin (or another file manager) the default for Mod+E, opening folders and Show in folder."

[[setting]]
key = "app"
type = "string"
label_key = "settings.app.label"
description_key = "settings.app.description"
default = "dolphin"

[[service]]
id = "service"
entry = "service.luau"
