# Umbriel config for the Cave Abode greeter: no keybinds, no shell, just
# your input settings (copied from ~/.config/umbriel/config.toml).
# Installed to /etc/cave-abode/greeter/umbriel.toml.

[keybinds]

[input.keyboard]
numlock_toggle = true

[input.touchpad]
# Windows precision-touchpad feel
# Toggle natural scroll to reverse direction (true = touch-style, false = traditional)
natural_scroll = true
tap = true                          # tap to click
tap_button_map = "left_right_middle" # 2-finger tap = right click, 3-finger = middle
click_method = "clickfinger"        # 2-finger press = right click (no corner zones)
disable_while_typing = true
accel_profile = "flat"               # no pointer acceleration (was adaptive)
sensitivity = 0.5                   # -1.0..1.0, raise for faster pointer

# Lower the scroll multiplier to slow down fast scrolling (default is 1.0)
scroll_factor = 0.225                # slow drags move less; flicks still coast in apps (default 1.0)

# External mouse: no acceleration ("Enhance pointer precision" off).
[input.mouse]
accel_profile = "flat"
sensitivity = 0.0                   # -1.0..1.0, raise for faster pointer

# Focus can follow the pointer across tiled, floating, and pinned windows.
# [input.focus]
# follows_mouse = true

# Confine touch input to one display.
# [input.touch]
# enabled = true
# map_to_output = "eDP-1"

# ==============================================================================
# Keybinds
# Defining this table replaces the built-in bind set, so every active bind that
# should remain available is listed here.
# Syntax: https://docs.noctalia.dev/umbriel/keybinds/
# Actions: https://docs.noctalia.dev/umbriel/actions/
