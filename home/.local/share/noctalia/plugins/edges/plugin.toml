# Edges - turns Noctalia's extra bars into a Caelestia-style frame.
#
# zone    -> an invisible strip for a border bar. Rest the pointer on it and it
#            runs an action (any `noctalia msg` command, or `exec <cmd>`), so
#            panels open on hover like Caelestia's drawers. Give each instance a
#            name in [widget.<name>] with its own `action` and `length`.
# center  -> the bottom-right action center (Windows-style): notifications
#            stacked on top, then quick toggles, volume and brightness sliders,
#            and the session buttons at the bottom. Pinned floating to the
#            bottom-right corner so it sits flush against the bottom and right
#            bars whichever bar opened it.
#
#   noctalia msg panel-toggle nafeel/edges:center

id = "nafeel/edges"
name = "Edges"
version = "1.0.0"
plugin_api = 32
author = "nafeel"
license = "MIT"
dependencies = ["wpctl", "brightnessctl", "powerprofilesctl"]
tags = ["bar", "panel", "quick-settings", "notifications"]
icon = "border-outer"
description = "Hover zones for border bars and a bottom-right action center with notifications, quick toggles, sliders and session buttons."

[[setting]]
key = "max_notifications"
type = "int"
label_key = "settings.max_notifications.label"
default = 30
min = 1
max = 100

[[widget]]
id = "zone"
entry = "zone.luau"

  [widget.actions]
  middle = "none"

  [[widget.setting]]
  key = "action"
  type = "string"
  label_key = "settings.action.label"
  description_key = "settings.action.description"
  default = "panel-open control-center"

  [[widget.setting]]
  key = "length"
  type = "int"
  label_key = "settings.length.label"
  description_key = "settings.length.description"
  default = 320
  min = 8
  max = 4000

  [[widget.setting]]
  key = "delay_ms"
  type = "int"
  label_key = "settings.delay_ms.label"
  description_key = "settings.delay_ms.description"
  default = 120
  min = 0
  max = 2000

[[panel]]
id = "center"
entry = "center.luau"
width = 400
height = 680
placement = "floating"
position = "bottom_right"

[[panel]]
id = "sliders"
entry = "sliders.luau"
width = 62
height = 360
placement = "attached"
